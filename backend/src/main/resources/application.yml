server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cart_rio_hub}
    username: ${SPRING_DATASOURCE_USERNAME:cart_rio}
    password: ${SPRING_DATASOURCE_PASSWORD:cart_rio}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
