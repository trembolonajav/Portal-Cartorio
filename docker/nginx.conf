server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Resolve os backends a cada requisicao pelo DNS do Docker, para o nginx nao
  # encerrar ao iniciar antes deles nem manter um IP antigo depois de recriados.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $portal_backend http://backend:8081;
  set $inventory_backend http://inventory-backend:8080;

  location /api/ {
    proxy_pass $portal_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /inventory-api/ {
    rewrite ^/inventory-api/(.*)$ /api/$1 break;
    proxy_pass $inventory_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
