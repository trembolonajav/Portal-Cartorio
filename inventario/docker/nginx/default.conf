server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve o backend a cada requisicao pelo DNS do Docker. Com o nome fixo no
    # proxy_pass, o nginx encerra ao iniciar se o backend ainda nao existir e
    # continua usando o IP antigo quando o backend e recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $inventory_backend http://inventory-backend:8080;

    location /api/ {
        proxy_pass $inventory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass $inventory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
